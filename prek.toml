[[repos]]
repo = "local"

[[repos.hooks]]
id = "fix"
name = "cargo fix"
entry = "./scripts/wrap_hook.sh fix cargo fix --all-targets --allow-dirty --allow-staged"
language = "system"
pass_filenames = false
always_run = true
groups = ["d", "r", "p"]

[[repos.hooks]]
id = "clippy"
name = "cargo clippy"
entry = "./scripts/wrap_hook.sh clippy cargo clippy --no-deps --all-targets -- -D warnings"
language = "system"
pass_filenames = false
always_run = true
groups = ["d", "r", "p"]

[[repos.hooks]]
id = "fmt"
name = "cargo fmt"
entry = "./scripts/wrap_hook.sh fmt cargo fmt"
language = "system"
pass_filenames = false
always_run = true
groups = ["d", "r", "p"]

[[repos.hooks]]
id = "test"
name = "cargo nextest"
entry = "./scripts/wrap_hook.sh test cargo nextest run --show-progress=none --failure-output=immediate-final"
language = "system"
pass_filenames = false
always_run = true
verbose = true
groups = ["d", "r", "p"]

[[repos.hooks]]
id = "machete"
name = "machete"
entry = "./scripts/wrap_hook.sh machete cargo machete"
language = "system"
pass_filenames = false
always_run = true
groups = ["r", "p"]

[[repos.hooks]]
id = "semver-checks"
name = "cargo semver-checks"
entry = "./scripts/wrap_hook.sh semver-checks sh -c 'export GIT_DIR=./.git && cargo semver-checks --baseline-rev HEAD~1'"
language = "system"
pass_filenames = false
always_run = true
groups = ["r"]